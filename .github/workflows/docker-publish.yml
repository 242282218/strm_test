# =============================================================================
# Docker Publish for quark_strm
# Push to GitHub Container Registry (ghcr.io) with semantic versioning
# =============================================================================

name: Docker Publish

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "web/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".github/workflows/docker-publish.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FRONTEND_IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  # ===========================================================================
  # Job 1: Build and Push
  # ===========================================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=${{ github.sha }},enable=true

      - name: Generate version
        id: version
        run: |
          VERSION=""
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="main-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}

      - name: Build and push frontend runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: frontend-runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.digest }}

  # ===========================================================================
  # Job 2: Test Deployment
  # ===========================================================================
  test-deployment:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}
          docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}

      - name: Create test configuration
        run: |
          cp .env.example .env
          {
            echo "QUARK_STRM_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}"
            echo "QUARK_STRM_FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}"
            echo "SMART_MEDIA_EMBY_PROXY_PORT=18097"
            echo "SMART_MEDIA_FRONTEND_PORT=18080"
          } >> .env
          cp config.example.yaml config.yaml
          mkdir -p logs strm
          touch quark_strm.db

      - name: Start services
        run: |
          docker compose --profile frontend up --pull never -d
          echo "Waiting for service to start..."

      - name: Wait for ready endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/ready" > /dev/null 2>&1; then
              echo "Service is ready!"
              curl -fsS "http://127.0.0.1:8000/ready" | jq '.'
              exit 0
            fi
            echo "Waiting for service... ($i/30)"
            sleep 2
          done
          echo "Service failed to start"
          docker compose logs --tail=100
          exit 1

      - name: Run smoke tests
        run: |
          # Test root endpoint
          curl -fsS "http://127.0.0.1:8000/" | jq '.'

          # Test API docs
          curl -fsS "http://127.0.0.1:8000/docs" > /dev/null && echo "API docs accessible"

          # Test OpenAPI schema
          curl -fsS "http://127.0.0.1:8000/openapi.json" | jq '.info'

          # Test frontend SPA and backend probe through Nginx
          curl -fsS "http://127.0.0.1:18080/" > /tmp/frontend-index.html
          grep -E '<div id="app"|<script[^>]+type="module"' /tmp/frontend-index.html
          curl -fsS "http://127.0.0.1:18080/login" > /tmp/frontend-login.html
          grep -E '<div id="app"|<script[^>]+type="module"' /tmp/frontend-login.html
          curl -fsS "http://127.0.0.1:18080/ready" | jq '.'

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  # Job 3: Security Scan
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-results
          path: trivy-results.txt
          if-no-files-found: warn

  # ===========================================================================
  # Job 4: Summary
  # ===========================================================================
  publish-summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, test-deployment, security-scan]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.build-and-push.outputs.tags }}" | tr ',' '\n' | while read -r tag; do
            echo "  - \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build and Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Deployment | ${{ needs.test-deployment.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Determine overall status
        run: |
          if [[ "${{ needs.build-and-push.result }}" == "failure" ]]; then
            echo "::error::Build failed"
            exit 1
          fi
          if [[ "${{ needs.test-deployment.result }}" == "failure" ]]; then
            echo "::error::Deployment test failed"
            exit 1
          fi
          echo "Docker publish completed successfully"

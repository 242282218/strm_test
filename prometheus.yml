# Prometheus 配置示例
# 用于监控 quark_strm 应用

global:
  # 抓取间隔
  scrape_interval: 15s
  # 评估规则间隔
  evaluation_interval: 15s
  # 抓取超时
  scrape_timeout: 10s

# 告警管理器配置（可选）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# 规则文件（可选）
# rule_files:
#   - "rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # quark_strm 应用监控
  - job_name: 'quark_strm'
    # 抓取间隔（可覆盖全局设置）
    scrape_interval: 10s
    # 指标路径
    metrics_path: '/metrics'
    # 静态配置
    static_configs:
      # Docker Compose 环境使用服务名
      - targets: ['quark-strm:8000']
        labels:
          app: 'quark_strm'
          env: 'production'
      # 本地开发环境
      # - targets: ['host.docker.internal:8001']
      #   labels:
      #     app: 'quark_strm'
      #     env: 'development'
    # 或者使用 Docker 服务发现
    # docker_sd_configs:
    #   - host: unix:///var/run/docker.sock
    #     refresh_interval: 5s
    #     filters:
    #       - name: label
    #         values: ["app=quark_strm"]
    # relabel_configs:
    #   - source_labels: [__meta_docker_container_name]
    #     target_label: container

  # 如果有多个实例，可以使用 DNS 服务发现
  # - job_name: 'quark_strm_cluster'
  #   dns_sd_configs:
  #     - names: ['quark-strm.service.consul']
  #       type: 'A'
  #       port: 8001

# 远程写入配置（可选，用于长期存储）
# remote_write:
#   - url: "http://remote-storage:9201/write"

# 远程读取配置（可选）
# remote_read:
